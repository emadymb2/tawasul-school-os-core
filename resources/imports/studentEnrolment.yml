details:
    type: studentEnrolment
    category: Students
    name: Student Enrolment
    table: tawasulStudentEnrolment
    modes: { update: true, insert: true, export: true }
access:
    module: Admissions
    action: Student Enrolment
primaryKey:
    tawasulStudentEnrolmentID
uniqueKeys:
    - [ tawasulSchoolYearID, tawasulYearGroupID, tawasulPersonID ]
    - [ tawasulSchoolYearID, tawasulFormGroupID, tawasulPersonID ]
table:
    tawasulSchoolYearID:
        name: "School Year"
        desc: "School year name, as set in School Admin. Must already exist."
        args: { filter: schoolyear, required: true, custom: true }
        relationship: { table: tawasulSchoolYear, key: tawasulSchoolYearID, field: name  }
    tawasulYearGroupID:
        name: "Year Group"
        desc: "Short Name"
        args: { filter: string, required: true }
        relationship: { table: tawasulYearGroup, key: tawasulYearGroupID, field: nameShort  }
    tawasulFormGroupID:
        name: "Form Group"
        desc: "Short Name"
        args: { filter: string, required: true }
        relationship: { table: tawasulFormGroup, key: tawasulFormGroupID, field: [ nameShort, tawasulSchoolYearID ]  }
    tawasulPersonID:
        name: "Student"
        desc: "Username or Email (if unique)"
        args: { filter: nospaces, required: true }
        relationship: { table: tawasulPerson, key: tawasulPersonID, field: username|email  }
    rollOrder:
        name: "Roll Order"
        desc: ""
        args: { filter: numeric, custom: true }
