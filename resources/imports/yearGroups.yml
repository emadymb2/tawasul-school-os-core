details:
    type: yearGroups
    name: Year Groups
    desc: 
    table: tawasulYearGroup
    modes: { update: true, insert: true, export: true }
access:
    module: School Admin
    action: Manage Year Groups
primaryKey:
    tawasulYearGroupID
uniqueKeys:
    - name
    - nameShort
table:
    name: 
        name: "Name"
        desc: "Must be unique."
        args: { filter: string, required: true }
    nameShort: 
        name: "Short Name"
        desc: "Must be unique."
        args: { filter: string, required: true }
    sequenceNumber: 
        name: "Sequence Number"
        desc: "Must be unique. Controls chronological ordering."
        args: { filter: numeric }
    tawasulPersonIDHOY: 
        name: "Head of Year"
        desc: "Username or Email (if unique)"
        args: { filter: string, custom: true }
        relationship: { table: tawasulPerson, key: tawasulPersonID, field: username|email }
