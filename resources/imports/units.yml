
details:
    type: units
    name: Units
    category: Units  
    table: tawasulUnit
    modes: { update: true, insert: true, export: true }
access:
    module: Planner
    action: Unit Planner
primaryKey:
    tawasulUnitID
table:
    tawasulSchoolYearID:
        name: "School Year"
        desc: "School year name, as set in School Admin. Must already exist."
        args: { filter: schoolyear, required: true, readonly: true, custom: true }
        relationship: { table: tawasulSchoolYear, key: tawasulSchoolYearID, field: name  }
    tawasulCourseID:
        name: "Course"
        desc: "Short Name"
        args: { filter: string, required: true }
        relationship: { table: tawasulCourse, key: tawasulCourseID, field: [ nameShort, tawasulSchoolYearID ]  }
    name:
        name: "Name"
        desc: "Unit name"
        args: { filter: string, required: true }
    description:
        name: "Description"
        args: { filter: string, required: true }
    active:
        name: "Active"
        args: { filter: yesno, required: true, custom: true }
    map:
        name: "Map"
        args: { filter: yesno, required: true, custom: true}
    ordering:
        name: "Ordering"
        args: { filter: numeric, required: true, custom: true}
    tags:
        name: "Concepts & Keywords"
        args: { filter: string, custom: true}
    details:
        name: "Unit Outline"
        args: { filter: string, custom: true}
