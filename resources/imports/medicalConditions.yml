details:
    type: medicalConditions
    name: Medical Conditions
    table: tawasulPersonMedicalCondition
    modes: { update: true, insert: true, export: true }
access:
    module: Students
    action: Manage Medical Forms
primaryKey:
    tawasulPersonMedicalConditionID
uniqueKeys:
    - [ tawasulPersonMedicalID, name, tawasulAlertLevelID, triggers ]
table:
    tawasulPersonMedicalID: 
        name: "Student"
        desc: "Username or Email (if unique)"
        args: { filter: string, required: true }
        relationship: { table: tawasulPersonMedical, key: tawasulPersonMedicalID, join: tawasulPerson, on: [tawasulPersonID,tawasulPersonID], field: username|email  }
    name: 
        name: "Condition Name"
        desc: ""
        args: {filter: string, required: true}
    tawasulAlertLevelID: 
        name: "Risk"
        desc: ""
        args: {filter: string, required: true}
        relationship: { table: tawasulAlertLevel, key: tawasulAlertLevelID, field: name  }
    triggers: 
        name: "Triggers"
        desc: ""
        args: {filter: string}
    reaction: 
        name: "Reaction"
        desc: ""
        args: {filter: string}
    response: 
        name: "Response"
        desc: ""
        args: {filter: string}
    medication: 
        name: "Medication"
        desc: ""
        args: {filter: string}
    lastEpisode: 
        name: "Last Episode"
        desc: ""
        args: {filter: date}
    lastEpisodeTreatment: 
        name: "Last Episode Treatment"
        desc: ""
        args: {filter: string}
    comment: 
        name: "Comment"
        desc: ""
        args: {filter: string}
