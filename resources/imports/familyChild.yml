details:
    type: familyChild
    name: Children
    category: Family
    table: tawasulFamilyChild
    modes: { update: true, insert: true, export: true }
access:
    module: User Admin
    action: Manage Families
primaryKey:
    tawasulFamilyChildID
uniqueKeys:
    - [ tawasulFamilyID, tawasulPersonID ]
table:
    tawasulFamilyID:
        name: "Family Sync Key"
        desc: "Unique ID for family, according to source system."
        args: { filter: string, required: true }
        relationship: { table: tawasulFamily, key: tawasulFamilyID, field: familySync  }
    tawasulPersonID:
        name: "Child"
        desc: "Username or Email (if unique)"
        args: { filter: nospaces, required: true }
        relationship: { table: tawasulPerson, key: tawasulPersonID, field: username|email  }
    comment:
        name: "Comment"
        desc: ""
        args: { filter: string }
