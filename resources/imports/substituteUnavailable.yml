details:
    type: substituteUnavailable
    category: Substitute
    name: Substitute Unavailability
    table: tawasulStaffCoverageDate
    modes: { update: true, insert: true, export: true }
access:
    module: Staff
    action: Manage Substitutes
primaryKey:
    tawasulStaffCoverageDateID
uniqueKeys:
    - [ tawasulPersonIDUnavailable, date ]
table:
    tawasulPersonIDUnavailable:
        name: "Substitute User"
        desc: "Username or Email (if unique)"
        args: { filter: nospaces, required: true }
        relationship: { table: tawasulPerson, key: tawasulPersonID, field: username|email  }
    date: 
        name: "Date"
        desc: "Must be unique. Format: YYYY-MM-DD"
        args: { filter: date, required: true }
    allDay:
        name: "All Day"
        desc: ""
        args: { filter: yesno, custom: true }
    timeStart:
        name: "Start Time"
        desc: "Format: hh:mm (24hr)"
        args: { filter: time, required: true }
    timeEnd:
        name: "End Time"
        desc: "Format: hh:mm (24hr)"
        args: { filter: time, required: true }
