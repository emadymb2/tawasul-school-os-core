details:
    type: schoolYearsSpecialDays
    name: Special Days
    table: tawasulSchoolYearSpecialDay
    modes: { update: true, insert: true, export: true }
access:
    module: School Admin
    action: Manage Special Days
primaryKey:
    tawasulSchoolYearSpecialDayID
uniqueKeys:
    - date
table:
    tawasulSchoolYearID: 
        name: "School Year"
        desc: "School year name, as set in School Admin. Must already exist."
        args: { filter: schoolyear, required: true, readonly: true }
        relationship: { table: tawasulSchoolYear, key: tawasulSchoolYearID, field: name  }
    tawasulSchoolYearTermID: 
        name: "Term"
        desc: "Short Name"
        args: { filter: string, required: true }
        relationship: { table: tawasulSchoolYearTerm, key: tawasulSchoolYearTermID, field: [ nameShort, tawasulSchoolYearID ]  }
    date: 
        name: "Date"
        desc: "Must be unique."
        args: { filter: date, required: true }
    type: 
        name: "Type"
        desc: ""
        args: { filter: string, required: true }
    name: 
        name: "Name"
        desc: ""
        args: { filter: string, required: true }
    description: 
        name: "Description"
        desc: ""
        args: { filter: string }
    schoolOpen: 
        name: "School Opens"
        desc: ""
        args: { filter: time }
    schoolStart: 
        name: "School Starts"
        desc: ""
        args: { filter: time }
    schoolEnd: 
        name: "School Ends"
        desc: ""
        args: { filter: time }
    schoolClose: 
        name: "School Closes"
        desc: ""
        args: { filter: time }
