details:
    type: studentNotes
    category: Students
    name: Student Notes
    table: tawasulStudentNote
    modes: { update: false, insert: true }
access:
    module: Students
    action: Student Enrolment
primaryKey:
    tawasulStudentNoteID
uniqueKeys:
    []
table:
    tawasulPersonID:
        name: "Student"
        desc: "Username or Email (if unique)"
        args: { filter: nospaces, required: true }
        relationship: { table: tawasulPerson, key: tawasulPersonID, field: username|email  }
    tawasulStudentNoteCategoryID:
        name: "Category"
        desc: ""
        args: { filter: string, required: true, custom: true }
        relationship: { table: tawasulStudentNoteCategory, key: tawasulStudentNoteCategoryID, field: name  }
    title:
        name: "Title"
        desc: ""
        args: { filter: string, required: true }
    note:
        name: "Note"
        desc: ""
        args: { filter: html, required: true }
    tawasulPersonIDCreator:
        name: "Created By"
        desc: "Username or Email (if unique)"
        args: { filter: string, custom: true }
        relationship: { table: tawasulPerson, key: tawasulPersonID, field: username|email  }
    timestamp:
        name: "Timestamp"
        desc: ""
        args: { filter: timestamp, hidden: true, function: timestamp }
