details:
    type: libraryRecordComputer
    name: Records - Computer
    table: tawasulLibraryItem
    modes: { update: true, insert: true, export: true }
access:
    module: Library
    action: Manage Catalog
primaryKey:
    tawasulLibraryItemID
uniqueKeys:
    - id
table:
    tawasulLibraryTypeID: 
        name: "Type"
        desc: ""
        value: "Computer"
        args: { filter: string, required: true, custom: true, hidden: true }
        relationship: { table: tawasulLibraryType, key: tawasulLibraryTypeID, field: name  }
    name: 
        name: "Name"
        desc: "Volume or product name."
        args: { filter: string, required: true }
    id: 
        name: "ID"
        desc: "Must be unique, or will lead to update not insert."
        args: { filter: string, required: true }
    producer: 
        name: "Author/Brand"
        desc: "Who created the item?"
        args: { filter: string, required: true, custom: true }
    vendor: 
        name: "Vendor"
        desc: "Who supplied the item?"
        args: { filter: string, custom: true }
    purchaseDate: 
        name: "Purchase Date"
        desc: ""
        args: { filter: date, custom: true }
    invoiceNumber: 
        name: "Invoice Number"
        desc: ""
        args: { filter: string, custom: true }
    cost: 
        name: "Cost"
        desc: ""
        args: { filter: numeric, custom: true }
    tawasulSpaceID: 
        name: "Location"
        desc: "Name"
        args: { filter: string, custom: true }
        relationship: { table: tawasulSpace, key: tawasulSpaceID, field: name }
    locationDetail: 
        name: "Location Detail"
        desc: "Shelf, cabinet, sector, etc"
        args: { filter: string, custom: true }
    ownershipType: 
        name: "Ownership Type"
        desc: ""
        args: { filter: string, custom: true }
    tawasulPersonIDOwnership: 
        name: "Main User"
        desc: "Username or email of person the device is assigned to."
        args: { filter: string, custom: true }
        relationship: { table: tawasulPerson, key: tawasulPersonID, field: username|email  }
    tawasulDepartmentID:
        name: "Department"
        desc: "Short Name"
        args: { filter: string, custom: true }
        relationship: { table: tawasulDepartment, key: tawasulDepartmentID, field: nameShort  }
    borrowable: 
        name: "Borrowable?"
        desc: "Is item available for loan?"
        args: { filter: yesno, custom: true }
    status: 
        name: "Status?"
        desc: ""
        args: { filter: string, custom: true }
    replacement: 
        name: "Replacement?"
        desc: ""
        args: { filter: yesno, custom: true }
    replacementCost: 
        name: "Replacement Cost"
        desc: ""
        args: { filter: numeric, custom: true }
    tawasulSchoolYearIDReplacement : 
        name: "Replacement Year"
        desc: "School year name, as set in School Admin. Must already exist."
        args: { filter: schoolyear, custom: true }
        relationship: { table: tawasulSchoolYear, key: tawasulSchoolYearID, field: name  }
    comment: 
        name: "Comments/Notes"
        desc: ""
        args: { filter: string, custom: true  }

    # Type-Specific Serializable Fields

    fieldFormFactor: 
        name: "Form Factor"
        desc: ""
        args: { filter: string, required: true, custom: true, readonly: true, serialize: fields  }
    fieldOperatingSystem: 
        name: "Operating System"
        desc: ""
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldSerialNumber: 
        name: "Serial Number"
        desc: ""
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldModelName: 
        name: "Model Name"
        desc: ""
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldModelID: 
        name: "Model ID"
        desc: ""
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldCPUType: 
        name: "CPU Type"
        desc: ""
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldCPUSpeed: 
        name: "CPU Speed"
        desc: "In GHz."
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldMemory: 
        name: "Memory"
        desc: "Total RAM, in GB."
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldStorageType: 
        name: "Storage Type"
        desc: "Primary internal storage type."
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldStorage: 
        name: "Storage"
        desc: "Total HDD/SDD capacity, in GB."
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldWirelessMACAddress: 
        name: "Wireless MAC Address"
        desc: ""
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldWiredMACAddress: 
        name: "Wired MAC Address"
        desc: ""
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldAccessories: 
        name: "Accessories"
        desc: "Any chargers, display dongles, remotes etc?"
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldWarrantyNumber: 
        name: "Warranty Number"
        desc: ""
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fieldWarrantyExpiry: 
        name: "Warranty Expiry"
        desc: ""
        args: { filter: date, custom: true, readonly: true, serialize: fields  }
    fieldLastReinstallDate: 
        name: "Last Reinstall Date"
        desc: ""
        args: { filter: date, custom: true, readonly: true, serialize: fields  }
    fieldRepairLog: 
        name: "Repair Log/Notes"
        desc: ""
        args: { filter: string, custom: true, readonly: true, serialize: fields  }
    fields:
        name: "Type-Specific Details"
        desc: ""
        args: { filter: string, serialize: fields, hidden: true, custom: true }
