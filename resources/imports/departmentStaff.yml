details:
    type: departmentStaff
    name: Departments - Staff
    table: tawasulDepartmentStaff
    modes: { update: true, insert: true, export: true }
access:
    module: School Admin
    action: Manage Departments
primaryKey:
    tawasulDepartmentStaffID
uniqueKeys:
    - [ tawasulDepartmentID, tawasulPersonID ]
table:
    tawasulDepartmentID:
        name: "Department"
        desc: "Short Name"
        args: { filter: string, required: true }
        relationship: { table: tawasulDepartment, key: tawasulDepartmentID, field: nameShort  }
    tawasulPersonID:
        name: "Staff"
        desc: "Username or Email (if unique)"
        args: { filter: nospaces, required: true }
        relationship: { table: tawasulPerson, key: tawasulPersonID, field: username|email  }
    role:
        name: "Role"
        desc: ""
        args: { filter: string, required: true, custom: true }
