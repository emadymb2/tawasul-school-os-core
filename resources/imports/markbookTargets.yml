details:
    type: markbookTargets
    name: Targets
    table: tawasulMarkbookTarget
    modes: { update: true, insert: true, export: true }
access:
    module: Markbook
    action: Edit Markbook_everything
fields:
    tawasulSchoolYearID: 
        name: "School Year"
        desc: "School year name, as set in School Admin. Must already exist."
        args: { filter: schoolyear, required: true, custom: true, readonly: true }
        relationship: { table: tawasulSchoolYear, key: tawasulSchoolYearID, field: name  }
    tawasulCourseID: 
        name: "Course"
        desc: "Short Name"
        args: { filter: string, required: true, custom: true, readonly: true }
        relationship: { table: tawasulCourse, key: tawasulCourseID, field: [ nameShort, tawasulSchoolYearID ]  }
    tawasulCourseClassID: 
        name: "Class"
        desc: "Short Name"
        args: { filter: string, required: true, custom: true }
        relationship: { table: tawasulCourseClass, key: tawasulCourseClassID, field: [ nameShort, tawasulCourseID ]  }
    tawasulPersonIDStudent: 
        name: "Student"
        desc: "Username or Email (if unique)"
        args: { filter: string, required: true }
        relationship: { table: tawasulPerson, key: tawasulPersonID, field: username|email  }
    tawasulScaleIDTarget: 
        name: "Grade Scale"
        desc: "Short Name"
        args: { filter: string, required: true, custom: true }
        relationship: { table: tawasulScale, key: tawasulScaleID, field: nameShort  }
    tawasulScaleGradeID: 
        name: "Target Grade"
        desc: "Value"
        args: { filter: string, required: true, custom: true }
        relationship: { table: tawasulScaleGrade, key: tawasulScaleGradeID, field: value  }
tables:
    tawasulMarkbookTarget: 
        primaryKey:
            tawasulMarkbookTargetID
        uniqueKeys:
            - [ tawasulCourseClassID, tawasulPersonIDStudent ]
        fields:
            - tawasulSchoolYearID
            - tawasulCourseID
            - tawasulCourseClassID
            - tawasulPersonIDStudent
            - tawasulScaleGradeID
    tawasulCourseClass:
        primaryKey:
            tawasulCourseClassID
        uniqueKeys:
            - [ tawasulCourseClassID ]
        fields:
            - tawasulSchoolYearID
            - tawasulCourseID
            - tawasulCourseClassID
            - tawasulScaleIDTarget
